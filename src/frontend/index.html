<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanban</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg hidden>
  <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></symbol>
  <symbol id="i-notes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M4 12h4M12 12h8M4 18h12"/><circle cx="17" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="19" cy="18" r="2"/></symbol>
</svg>

<header>
  <h1></h1>
  <nav hidden></nav>
  <input type="search" placeholder="Search  Ctrl /" aria-label="Search cards">
  <button type="button" title="Settings  Ctrl ," aria-label="Settings"><svg><use href="#i-settings"/></svg></button>
</header>

<main></main>

<template id="column">
  <section>
    <header>
      <h2></h2><output></output>
      <button type="button" title="Clear column" aria-label="Clear column"><svg><use href="#i-trash"/></svg></button>
    </header>
    <ol></ol>
    <input placeholder="+ Add card" aria-label="Add card" title="Class: title · Enter adds · Shift+Enter opens editor · paste lines for many">
  </section>
</template>

<template id="card">
  <li>
    <article draggable="true">
      <small></small>
      <h3></h3>
      <footer>
        <time></time>
        <a title="Open link"><svg><use href="#i-link"/></svg></a>
        <svg data-notes><title>Has notes</title><use href="#i-notes"/></svg>
        <span></span>
      </footer>
    </article>
  </li>
</template>

<dialog>
  <form method="dialog">
    <label>Class<input name="subtitle" autocomplete="off"></label>
    <label>Title<input name="title" required autocomplete="off"></label>
    <fieldset>
      <label>Due<input name="due" type="date"></label>
      <label>Difficulty
        <select name="difficulty">
          <option value="">—</option>
          <option value="1">●○○ easy</option>
          <option value="2">●●○ medium</option>
          <option value="3">●●● hard</option>
        </select>
      </label>
    </fieldset>
    <label>Link<input name="link" type="url" placeholder="https://"></label>
    <label>Notes<textarea name="notes"></textarea></label>
    <menu>
      <button value="delete" formnovalidate>Delete</button>
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="save">Save</button>
    </menu>
  </form>
</dialog>

<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <label>Text size
      <select name="zoom">
        <option value="0.9">Small</option>
        <option value="1">Default</option>
        <option value="1.15">Large</option>
        <option value="1.3">Larger</option>
        <option value="1.5">Largest</option>
      </select>
    </label>
    <menu><button value="save">Done</button></menu>
  </form>
</dialog>

<script src="data.js"></script>
<script src="dates.js"></script>
<script src="ui.js"></script>
</body>
</html>
